name: 构建并部署到服务器

# 触发条件：推送到 main 分支，或在 Actions 页面手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只跑一个部署，避免并发写坏站点目录
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # 服务器地址与部署用户（非机密，直接写在这里，方便修改）
  SSH_HOST: 49.232.251.198
  SSH_USER: ubuntu
  # 服务器上的站点根目录
  DEPLOY_PATH: /var/www/blog

jobs:
  build-and-deploy:
    name: 构建 + 部署
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建站点
        run: pnpm build

      - name: 检查构建产物
        run: |
          echo "构建产物大小：$(du -sh dist | cut -f1)"
          echo "页面数量：$(find dist -name '*.html' | wc -l)"
          test -f dist/index.html || { echo "::error::dist/index.html 不存在，构建失败"; exit 1; }

      - name: 准备部署密钥
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/deploy_key
          # 说明：这把密钥在服务器端被限制为 rrsync 只写模式（command="rrsync -wo ..."），
          # 因此这里不能再用 ssh 执行任何命令（whoami / ls 都会被拒），
          # 只能通过 rsync 传输。这是刻意的安全设计。

      - name: 同步到服务器
        run: |
          # 目标写 :/  而不是 :$DEPLOY_PATH/
          # 原因：服务器端这把密钥被限制为 rrsync -wo /var/www/blog，
          #       rrsync 会把客户端路径当作「受限目录下的相对路径」。
          #       写 :/         → 落在 /var/www/blog/        ✅
          #       写 :/var/www/blog/ → 会建成 /var/www/blog/var/www/blog/  ❌
          #
          # --delete 会清理目标目录里多余的旧文件（安全，因为目标就是站点根）
          # 注意：服务器端密钥被 rrsync -wo 限制，它有一份安全白名单，
          #       --chmod / --no-group / --human-readable 都不在白名单里，会被拒。
          #       因此这里用 -rltpz（递归+链接+时间+权限+压缩）替代 -avz：
          #       -a 展开的 -o/-g 会尝试 chown/chgrp，非 root 会失败告警且无效。
          #       文件权限由构建产物默认的 644/755 保证（nginx 以 other 身份可读）。
          rsync -rltpz --delete \
            --exclude '.well-known/' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            dist/ "$SSH_USER@$SSH_HOST:/"

      - name: 验证线上可访问
        run: |
          sleep 3
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -L https://tangjin.xyz/ --max-time 20 || echo 000)
          echo "线上首页 HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::线上返回 $CODE，部署可能有问题"
            exit 1
          fi

      - name: 部署结果摘要
        if: always()
        run: |
          {
            echo "### 部署结果"
            echo ""
            echo "- 提交：\`${{ github.sha }}\`"
            echo "- 触发：${{ github.event_name }}"
            echo "- 站点：https://tangjin.xyz"
            echo "- 时间：$(date '+%Y-%m-%d %H:%M:%S %Z')"
          } >> "$GITHUB_STEP_SUMMARY"
