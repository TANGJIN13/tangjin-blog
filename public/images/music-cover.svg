<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- 唱片底色 -->
    <radialGradient id="vinyl" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b3352"/>
      <stop offset="55%" stop-color="#241f38"/>
      <stop offset="100%" stop-color="#14111f"/>
    </radialGradient>
    <!-- 中心标签 -->
    <linearGradient id="label" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b7cf6"/>
      <stop offset="50%" stop-color="#6d5cff"/>
      <stop offset="100%" stop-color="#4f7dff"/>
    </linearGradient>
    <!-- 高光 -->
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.14"/>
    </linearGradient>
    <!-- 背景光晕 -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6d5cff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6d5cff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="discClip"><circle cx="200" cy="200" r="176"/></clipPath>
  </defs>

  <!-- 背景 -->
  <rect width="400" height="400" fill="#0f0d18"/>
  <circle cx="200" cy="200" r="200" fill="url(#glow)"/>

  <!-- 唱盘 -->
  <circle cx="200" cy="200" r="176" fill="url(#vinyl)"/>

  <!-- 纹路 -->
  <g clip-path="url(#discClip)" stroke="#ffffff" stroke-opacity="0.055" fill="none">
    <circle cx="200" cy="200" r="162" stroke-width="1.5"/>
    <circle cx="200" cy="200" r="150" stroke-width="1"/>
    <circle cx="200" cy="200" r="138" stroke-width="1.5"/>
    <circle cx="200" cy="200" r="126" stroke-width="1"/>
    <circle cx="200" cy="200" r="114" stroke-width="1.5"/>
    <circle cx="200" cy="200" r="102" stroke-width="1"/>
    <circle cx="200" cy="200" r="92" stroke-width="1.5"/>
    <circle cx="200" cy="200" r="82" stroke-width="1"/>
    <circle cx="200" cy="200" r="72" stroke-width="1.5"/>
  </g>

  <!-- 高光扫过 -->
  <g clip-path="url(#discClip)">
    <path d="M24 200 A176 176 0 0 1 200 24 L200 60 A140 140 0 0 0 60 200 Z" fill="url(#sheen)"/>
  </g>

  <!-- 中心标签 -->
  <circle cx="200" cy="200" r="58" fill="url(#label)"/>
  <circle cx="200" cy="200" r="58" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- 标签上的音乐符号 -->
  <g fill="#ffffff" fill-opacity="0.95">
    <path d="M214 168v46.5q-2.6-1.6-5.7-2.5t-6.3-.9q-6.6 0-11.3 3.7T186 224t4.7 9.2t11.3 3.7q6.2 0 10.9-3.3t4.8-8.9V180l18-4.8V162z"/>
  </g>

  <!-- 中心孔 -->
  <circle cx="200" cy="200" r="13" fill="#0f0d18"/>
  <circle cx="200" cy="200" r="13" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- 外圈描边 -->
  <circle cx="200" cy="200" r="176" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>
</svg>
