<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-label="站点横幅背景">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef0ff"/>
      <stop offset="0.5" stop-color="#f5f0ff"/>
      <stop offset="1" stop-color="#e8f4ff"/>
    </linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c6cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4f7dff" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="b" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b48cff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7cd9ff" stop-opacity="0.10"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="640" fill="url(#bg)"/>
  <g fill="url(#a)">
    <circle cx="200" cy="120" r="220"/>
    <circle cx="1400" cy="90" r="260"/>
  </g>
  <g fill="url(#b)">
    <circle cx="1200" cy="560" r="300"/>
    <circle cx="420" cy="540" r="200"/>
  </g>
  <g stroke="#6d5cff" stroke-opacity="0.12" stroke-width="1">
    <line x1="0" y1="160" x2="1600" y2="160"/>
    <line x1="0" y1="320" x2="1600" y2="320"/>
    <line x1="0" y1="480" x2="1600" y2="480"/>
    <line x1="200" y1="0" x2="200" y2="640"/>
    <line x1="600" y1="0" x2="600" y2="640"/>
    <line x1="1000" y1="0" x2="1000" y2="640"/>
    <line x1="1400" y1="0" x2="1400" y2="640"/>
  </g>
</svg>
