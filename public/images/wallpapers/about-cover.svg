<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- 夜空渐变 -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="40%" stop-color="#1a1140"/>
      <stop offset="70%" stop-color="#2d1b4e"/>
      <stop offset="100%" stop-color="#1a1025"/>
    </linearGradient>

    <!-- 月亮光晕 -->
    <radialGradient id="moon-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8d5f5" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#c4a8e8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#c4a8e8" stop-opacity="0"/>
    </radialGradient>

    <!-- 月亮本体 -->
    <radialGradient id="moon-body" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fef9ef"/>
      <stop offset="70%" stop-color="#f0ddb8"/>
      <stop offset="100%" stop-color="#d4b896"/>
    </radialGradient>

    <!-- 樱花花瓣 -->
    <linearGradient id="petal1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fce4ec"/>
      <stop offset="100%" stop-color="#f8bbd0"/>
    </linearGradient>
    <linearGradient id="petal2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3e5f5"/>
      <stop offset="100%" stop-color="#e1bee7"/>
    </linearGradient>

    <!-- 水面/地面 -->
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1025" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0612"/>
    </linearGradient>

    <!-- 模糊滤镜 -->
    <filter id="blur-lg"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="blur-sm"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <!-- 夜空背景 -->
  <rect width="1200" height="400" fill="url(#sky)"/>

  <!-- 星星 -->
  <g fill="#fff">
    <!-- 大星星 -->
    <circle cx="120" cy="60" r="2" opacity="0.9"><animate attributeName="opacity" values="0.9;0.4;0.9" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="350" cy="40" r="1.8" opacity="0.8"><animate attributeName="opacity" values="0.8;0.3;0.8" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="80" r="2.2" opacity="0.9"><animate attributeName="opacity" values="0.9;0.5;0.9" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="50" r="1.5" opacity="0.7"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="70" r="2" opacity="0.85"><animate attributeName="opacity" values="0.85;0.35;0.85" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="1020" cy="45" r="1.6" opacity="0.75"><animate attributeName="opacity" values="0.75;0.3;0.75" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="90" r="2.5" opacity="0.9"><animate attributeName="opacity" values="0.9;0.4;0.9" dur="2.2s" repeatCount="indefinite"/></circle>

    <!-- 小星星 -->
    <circle cx="80" cy="120" r="1" opacity="0.5"/>
    <circle cx="200" cy="90" r="0.8" opacity="0.4"/>
    <circle cx="280" cy="130" r="1.2" opacity="0.6"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="110" r="0.7" opacity="0.35"/>
    <circle cx="580" cy="30" r="1" opacity="0.5"/>
    <circle cx="750" cy="100" r="0.9" opacity="0.45"><animate attributeName="opacity" values="0.45;0.15;0.45" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="120" r="1.1" opacity="0.55"/>
    <circle cx="1080" cy="80" r="0.8" opacity="0.4"/>
    <circle cx="450" cy="150" r="0.6" opacity="0.3"/>
    <circle cx="620" cy="140" r="0.9" opacity="0.5"><animate attributeName="opacity" values="0.5;0.2;0.5" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="25" r="0.7" opacity="0.35"/>
    <circle cx="960" cy="55" r="1" opacity="0.45"/>
    <circle cx="1120" cy="130" r="0.8" opacity="0.4"/>
    <circle cx="160" cy="170" r="0.6" opacity="0.25"/>
    <circle cx="310" cy="180" r="0.7" opacity="0.3"/>
    <circle cx="490" cy="190" r="0.5" opacity="0.2"/>
    <circle cx="710" cy="170" r="0.8" opacity="0.35"><animate attributeName="opacity" values="0.35;0.1;0.35" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="160" r="0.6" opacity="0.25"/>
    <circle cx="1050" cy="150" r="0.7" opacity="0.3"/>
  </g>

  <!-- 月亮光晕 -->
  <circle cx="950" cy="130" r="180" fill="url(#moon-halo)" filter="url(#blur-lg)"/>
  <circle cx="950" cy="130" r="100" fill="url(#moon-halo)" filter="url(#blur-sm)"/>

  <!-- 月亮 -->
  <circle cx="950" cy="130" r="55" fill="url(#moon-body)"/>
  <!-- 月亮上的暗斑（玉兔） -->
  <g opacity="0.15" transform="translate(935,115)">
    <ellipse cx="0" cy="10" rx="12" ry="9" fill="#b8956a"/>
    <circle cx="0" cy="0" r="7" fill="#b8956a"/>
    <ellipse cx="-4" cy="-10" rx="2" ry="5" fill="#b8956a"/>
    <ellipse cx="4" cy="-10" rx="2" ry="5" fill="#b8956a"/>
  </g>

  <!-- 樱花花瓣飘落 -->
  <g>
    <ellipse cx="180" cy="60" rx="3" ry="5.5" fill="url(#petal1)" transform="rotate(30 180 60)" opacity="0.8">
      <animate attributeName="cy" values="60;350" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="180;200" dur="9s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="400" cy="30" rx="2.5" ry="5" fill="url(#petal2)" transform="rotate(-25 400 30)" opacity="0.7">
      <animate attributeName="cy" values="30;360" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="400;380" dur="11s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="600" cy="80" rx="3" ry="5" fill="url(#petal1)" transform="rotate(45 600 80)" opacity="0.75">
      <animate attributeName="cy" values="80;370" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="600;630" dur="8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="800" cy="50" rx="2.5" ry="4.5" fill="url(#petal2)" transform="rotate(-35 800 50)" opacity="0.65">
      <animate attributeName="cy" values="50;340" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="800;770" dur="10s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1050" cy="90" rx="2.8" ry="5" fill="url(#petal1)" transform="rotate(20 1050 90)" opacity="0.7">
      <animate attributeName="cy" values="90;380" dur="7.5s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="1050;1080" dur="7.5s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="250" cy="150" rx="2" ry="4" fill="url(#petal2)" transform="rotate(-40 250 150)" opacity="0.6">
      <animate attributeName="cy" values="150;390" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="250;230" dur="12s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="500" cy="120" rx="2.2" ry="4.2" fill="url(#petal1)" transform="rotate(35 500 120)" opacity="0.55">
      <animate attributeName="cy" values="120;370" dur="9.5s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="500;520" dur="9.5s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="700" cy="100" rx="2.5" ry="4.8" fill="url(#petal2)" transform="rotate(-30 700 100)" opacity="0.6">
      <animate attributeName="cy" values="100;360" dur="10.5s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="700;670" dur="10.5s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1100" cy="40" rx="2.8" ry="5" fill="url(#petal1)" transform="rotate(40 1100 40)" opacity="0.7">
      <animate attributeName="cy" values="40;350" dur="8.5s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="1100;1130" dur="8.5s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- 远景樱花树 -->
  <g opacity="0.25">
    <rect x="60" y="220" width="5" height="80" rx="2.5" fill="#3d2060"/>
    <ellipse cx="62" cy="215" rx="18" ry="22" fill="#5c3d8a"/>
    <ellipse cx="55" cy="205" rx="10" ry="12" fill="#4a2d70"/>
    <ellipse cx="70" cy="200" rx="8" ry="10" fill="#3d2060"/>
  </g>
  <g opacity="0.2">
    <rect x="1120" y="240" width="4" height="60" rx="2" fill="#3d2060"/>
    <ellipse cx="1122" cy="235" rx="14" ry="18" fill="#5c3d8a"/>
    <ellipse cx="1115" cy="228" rx="8" ry="10" fill="#4a2d70"/>
  </g>

  <!-- 地面渐变 -->
  <rect y="320" width="1200" height="80" fill="url(#ground)"/>

  <!-- 水面月亮倒影 -->
  <g opacity="0.12">
    <ellipse cx="950" cy="340" rx="30" ry="8" fill="#e8d5f5" filter="url(#blur-sm)"/>
    <line x1="920" y1="335" x2="980" y2="335" stroke="#e8d5f5" stroke-width="0.5"/>
    <line x1="930" y1="345" x2="970" y2="345" stroke="#e8d5f5" stroke-width="0.3"/>
  </g>
</svg>
