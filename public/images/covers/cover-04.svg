<ellipse cx="322" cy="49" rx="250" ry="23" fill="#ffffff" opacity="0.35"/>
<ellipse cx="488" cy="143" rx="138" ry="20" fill="#ffffff" opacity="0.44"/>
<ellipse cx="795" cy="34" rx="101" ry="35" fill="#fbe9c8" opacity="0.42"/>
