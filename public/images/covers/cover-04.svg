<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0.08" y2="1">
<stop offset="0%" stop-color="#fdf3e0"/>
<stop offset="24%" stop-color="#f9d9a8"/>
<stop offset="46%" stop-color="#f0b878"/>
<stop offset="70%" stop-color="#c98f6d"/>
<stop offset="100%" stop-color="#8a5a5e"/>
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#fff3d0" stop-opacity="0.95"/>
<stop offset="30%" stop-color="#fff3d0" stop-opacity="0.5"/>
<stop offset="100%" stop-color="#fff3d0" stop-opacity="0"/>
</radialGradient>
<linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#fbe9c8" stop-opacity="0"/>
<stop offset="100%" stop-color="#fbe9c8" stop-opacity="0.5"/>
</linearGradient>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="16"/></filter>
<filter id="softer" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="42"/></filter>
<pattern id="grain" patternUnits="userSpaceOnUse" width="160" height="160"><filter id="gn"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="160" height="160" filter="url(#gn)" opacity="0.045"/></pattern>
</defs>
<rect width="800" height="450" fill="url(#sky)"/>
<circle cx="440" cy="225" r="150" fill="url(#glow)"/>
<circle cx="440" cy="225" r="60" fill="#fff3d0" opacity="0.92" filter="url(#soft)"/>
