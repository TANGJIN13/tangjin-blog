<ellipse cx="532" cy="160" rx="119" ry="19" fill="#ffffff" opacity="0.32"/>
<ellipse cx="230" cy="51" rx="235" ry="14" fill="#ffffff" opacity="0.44"/>
<ellipse cx="705" cy="99" rx="252" ry="26" fill="#fbe9c8" opacity="0.44"/>
