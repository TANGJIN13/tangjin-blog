<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0.08" y2="1">
<stop offset="0%" stop-color="#e3f2f9"/>
<stop offset="30%" stop-color="#b8dcee"/>
<stop offset="55%" stop-color="#8fc4e2"/>
<stop offset="78%" stop-color="#5e9cc4"/>
<stop offset="100%" stop-color="#3f7ba3"/>
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
<stop offset="30%" stop-color="#ffffff" stop-opacity="0.5"/>
<stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
</radialGradient>
<linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#d4ecf5" stop-opacity="0"/>
<stop offset="100%" stop-color="#d4ecf5" stop-opacity="0.5"/>
</linearGradient>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="16"/></filter>
<filter id="softer" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="42"/></filter>
<pattern id="grain" patternUnits="userSpaceOnUse" width="160" height="160"><filter id="gn"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="160" height="160" filter="url(#gn)" opacity="0.045"/></pattern>
</defs>
<rect width="800" height="450" fill="url(#sky)"/>
<circle cx="600" cy="135" r="130" fill="url(#glow)"/>
<circle cx="600" cy="135" r="40" fill="#ffffff" opacity="0.92" filter="url(#soft)"/>
<g filter="url(#softer)">
<ellipse cx="647" cy="81" rx="160" ry="29" fill="#d4ecf5" opacity="0.47"/>
<ellipse cx="540" cy="69" rx="256" ry="33" fill="#d4ecf5" opacity="0.33"/>
<ellipse cx="703" cy="157" rx="213" ry="28" fill="#ffffff" opacity="0.42"/>
<ellipse cx="72" cy="99" rx="195" ry="23" fill="#d4ecf5" opacity="0.47"/>
