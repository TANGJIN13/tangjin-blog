<ellipse cx="697" cy="84" rx="120" ry="15" fill="#ffffff" opacity="0.47"/>
</g>
<rect x="0" y="279" width="800" height="171" fill="#3f7ba3" opacity="0.92"/>
<rect x="574" y="279" width="52" height="171" fill="#ffffff" opacity="0.18" filter="url(#soft)"/>
<rect x="0" y="299" width="800" height="2" fill="#ffffff" opacity="0.28"/>
