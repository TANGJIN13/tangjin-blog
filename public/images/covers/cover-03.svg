<rect x="0" y="337" width="800" height="2" fill="#ffffff" opacity="0.18"/>
<rect x="0" y="239" width="800" height="90" fill="url(#haze)"/>
<rect width="800" height="450" fill="url(#grain)"/>
<radialGradient id="vig" cx="50%" cy="46%" r="72%"><stop offset="55%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity="0.24"/></radialGradient>
<rect width="800" height="450" fill="url(#vig)"/>
</svg>