<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0.08" y2="1">
<stop offset="0%" stop-color="#f7e8f4"/>
<stop offset="28%" stop-color="#e8cde8"/>
<stop offset="52%" stop-color="#c4a8d6"/>
<stop offset="76%" stop-color="#8f7ab8"/>
<stop offset="100%" stop-color="#5f548f"/>
</linearGradient>
