<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
<stop offset="0%" stop-color="#f6e3ff"/>
<stop offset="52%" stop-color="#c79ce0"/>
<stop offset="100%" stop-color="#8e5bb0"/>
</linearGradient>
<radialGradient id="sun" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#ffe2f0" stop-opacity="1"/>
