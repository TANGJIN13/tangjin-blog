<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>写文章 · tj-blog</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; background: #f8f9fa; color: #333; }
    .max-width { max-width: 960px; margin: 0 auto; padding: 1rem; }

    /* 头部 */
    .header { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 0.75rem 1rem; position: sticky; top: 0; z-index: 10; }
    .header-inner { max-width: 960px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
    .logo { font-weight: 700; font-size: 1.1rem; color: #6d5cff; text-decoration: none; }
    .header-actions { display: flex; gap: 0.5rem; }

    /* 按钮 */
    .btn { padding: 0.5rem 1rem; border-radius: 0.5rem; border: 1px solid #d1d5db; background: #fff; cursor: pointer; font-size: 0.9rem; transition: all 0.15s; }
    .btn:hover { border-color: #6d5cff; color: #6d5cff; }
    .btn-primary { background: #6d5cff; color: #fff; border-color: #6d5cff; }
    .btn-primary:hover { background: #5a4ad1; color: #fff; }
    .btn-danger { border-color: #ef4444; color: #ef4444; }
    .btn-danger:hover { background: #fef2f2; }

    /* 提示条 */
    .hint-bar {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.7rem 1rem; margin-bottom: 1rem;
      background: linear-gradient(135deg, #f5f3ff, #eef2ff);
      border: 1px solid #ddd6fe; border-radius: 0.75rem;
      font-size: 0.85rem; color: #4c1d95;
    }
    .hint-text { flex: 1; line-height: 1.6; }
    .hint-close {
      border: none; background: transparent; cursor: pointer;
      font-size: 1.25rem; line-height: 1; color: #7c3aed;
      padding: 0 0.25rem; border-radius: 0.25rem;
    }
    .hint-close:hover { background: #ede9fe; }
    .hint-bar.hidden { display: none; }

    /* 设置面板 */
    .settings-panel { background: #fff; border: 1px solid #e5e7eb; border-radius: 0.75rem; padding: 1.25rem; margin-bottom: 1rem; display: none; }
    .settings-panel.open { display: block; }
    .form-group { margin-bottom: 0.75rem; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 0.25rem; color: #6b7280; }
    .form-group input, .form-group textarea { width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #d1d5db; border-radius: 0.5rem; font-size: 0.9rem; font-family: inherit; }
    .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #6d5cff; box-shadow: 0 0 0 3px rgba(109,92,255,0.1); }
.form-group select { width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #d1d5db; border-radius: 0.5rem; font-size: 0.9rem; font-family: inherit; background: #fff; }
    .form-group select:focus { outline: none; border-color: #6d5cff; box-shadow: 0 0 0 3px rgba(109,92,255,0.1); }

    /* 编辑器 */
    .editor-panel { background: #fff; border: 1px solid #e5e7eb; border-radius: 0.75rem; overflow: hidden; }
    .editor-toolbar { display: flex; gap: 0.5rem; padding: 0.5rem 0.75rem; border-bottom: 1px solid #e5e7eb; background: #f9fafb; flex-wrap: wrap; }
    .toolbar-btn { padding: 0.3rem 0.6rem; border: 1px solid #d1d5db; border-radius: 0.375rem; background: #fff; cursor: pointer; font-size: 0.8rem; }
    .toolbar-btn:hover { border-color: #6d5cff; color: #6d5cff; }

    .editor-split { display: grid; grid-template-columns: 1fr 1fr; min-height: 60vh; }
    .editor-pane { border-right: 1px solid #e5e7eb; }
    .editor-pane textarea { width: 100%; height: 100%; min-height: 60vh; border: none; outline: none; padding: 1rem; font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-size: 0.88rem; line-height: 1.7; resize: none; }
    .preview-pane { padding: 1rem; overflow-y: auto; }
    .preview-pane h1 { font-size: 1.6rem; margin: 0 0 0.5rem; }
    .preview-pane h2 { font-size: 1.3rem; margin: 1.5rem 0 0.5rem; padding-bottom: 0.3rem; border-bottom: 1px solid #e5e7eb; }
    .preview-pane h3 { font-size: 1.1rem; margin: 1.2rem 0 0.4rem; }
    .preview-pane p { margin-bottom: 0.8rem; }
    .preview-pane code { background: #f3f4f6; padding: 0.1rem 0.35rem; border-radius: 0.25rem; font-size: 0.85em; }
    .preview-pane pre { background: #1e1e2e; color: #e5e7eb; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; }
    .preview-pane pre code { background: none; padding: 0; color: inherit; }
    .preview-pane blockquote { border-left: 3px solid #6d5cff; margin: 1rem 0; padding: 0.5rem 1rem; background: #f5f3ff; color: #6b7280; }
    .preview-pane img { max-width: 100%; border-radius: 0.5rem; }
    .preview-pane table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
    .preview-pane th, .preview-pane td { border: 1px solid #e5e7eb; padding: 0.4rem 0.6rem; text-align: left; }
    .preview-pane th { background: #f9fafb; }

    /* 文章列表 */
    .posts-list { margin-top: 1rem; }
    .post-item { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 1rem; background: #fff; border: 1px solid #e5e7eb; border-radius: 0.5rem; margin-bottom: 0.5rem; }
    .post-item:hover { border-color: #6d5cff; }
    .post-item-info { display: flex; flex-direction: column; gap: 0.15rem; }
    .post-item-title { font-weight: 600; font-size: 0.95rem; }
    .post-item-meta { font-size: 0.78rem; color: #9ca3af; }
    .post-item-actions { display: flex; gap: 0.3rem; }

    /* 管理面板（友链/分类） */
    .manage-panel { margin-top: 1rem; }
    .manage-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.5rem; }
    .manage-tip { font-size: 0.8rem; color: #9ca3af; margin: 0 0 1rem; }
    .manage-item { display: flex; align-items: center; justify-content: space-between; padding: 0.7rem 1rem; background: #fff; border: 1px solid #e5e7eb; border-radius: 0.5rem; margin-bottom: 0.5rem; gap: 0.75rem; }
    .manage-item:hover { border-color: #6d5cff; }
    .manage-item-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: #f3f4f6; }
    .manage-item-icon { width: 36px; height: 36px; border-radius: 0.5rem; background: #f5f3ff; color: #6d5cff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 0.85rem; }
    .manage-item-info { flex: 1; min-width: 0; }
    .manage-item-name { font-weight: 600; font-size: 0.92rem; }
    .manage-item-desc { font-size: 0.78rem; color: #9ca3af; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .manage-item-actions { display: flex; gap: 0.3rem; flex-shrink: 0; }
    .manage-form { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 0.75rem; padding: 1.25rem; margin-top: 1rem; }
    .manage-form h4 { margin: 0 0 1rem; }
    .btn-sm { padding: 0.3rem 0.6rem; font-size: 0.78rem; border: 1px solid #d1d5db; border-radius: 0.375rem; background: #fff; cursor: pointer; }
    .btn-sm:hover { border-color: #6d5cff; color: #6d5cff; }
    .btn-sm.danger { color: #ef4444; }
    .btn-sm.danger:hover { border-color: #ef4444; color: #ef4444; }

    /* 提示 */
    .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; padding: 0.75rem 1.25rem; border-radius: 0.5rem; color: #fff; font-size: 0.9rem; z-index: 9999; opacity: 0; transform: translateY(10px); transition: all 0.3s; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.success { background: #10b981; }
    .toast.error { background: #ef4444; }
    .toast.info { background: #6d5cff; }

    /* frontmatter 编辑 */
    .frontmatter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .nav-ico { width: 1rem; height: 1rem; vertical-align: -0.15rem; display: inline-block; }
    .token-status { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0.75rem 1rem; margin-bottom: 1rem; background: #fffbeb; border: 1px solid #fcd34d; border-radius: 0.75rem; font-size: 0.85rem; color: #92400e; }
    .token-status-text { display: flex; align-items: center; gap: 0.5rem; }
    .token-status svg { flex-shrink: 0; }

    @media (max-width: 768px) {
      .editor-split { grid-template-columns: 1fr; }
      .editor-pane { border-right: none; border-bottom: 1px solid #e5e7eb; }
      .editor-pane textarea { min-height: 40vh; }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <a class="logo" href="/">tj-blog</a>
    <div class="header-actions">
      <button class="btn" id="btn-settings"><svg class="nav-ico" viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 00-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>设置</button>
      <button class="btn" id="btn-posts"><svg class="nav-ico" viewBox="0 0 24 24" fill="currentColor"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h10v2H4z"/></svg>文章</button>
      <button class="btn" id="btn-friends"><svg class="nav-ico" viewBox="0 0 24 24" fill="currentColor"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>友链</button>
      <button class="btn" id="btn-categories"><svg class="nav-ico" viewBox="0 0 24 24" fill="currentColor"><path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>分类</button>
      <a class="btn" id="link-actions" href="https://github.com/TANGJIN13/tangjin-blog/actions" target="_blank" rel="noopener"><svg class="nav-ico" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>状态</a>
      <button class="btn btn-primary" id="btn-new">+ 新建文章</button>
    </div>
</div>

<div class="max-width">
    <!-- Token 状态提示条 -->
    <div class="token-status" id="token-status" style="display:none">
      <div class="token-status-text">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="currentColor" style="color:#f59e0b;width:1.1rem;height:1.1rem;vertical-align:-0.15rem"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
        <span id="token-status-msg">未配置 GitHub Token，所有功能不可用。请点右上角「设置」。</span>
      </div>
      <button class="btn-sm" id="token-status-go" style="background:#f59e0b;color:#fff;border:none">去设置</button>
    </div>

    <!-- 使用提示 -->
  <div class="hint-bar" id="hint-bar">
    <div class="hint-text">
      <strong>发布流程</strong>：写好文章 → 点「发布」→ 自动提交到 GitHub → 自动构建部署 → 约 1-2 分钟后线上生效
    </div>
    <button class="hint-close" id="hint-close" aria-label="关闭提示">×</button>
  </div>

  <!-- 设置面板 -->
  <div class="settings-panel" id="settings-panel">
    <h3 style="margin-top:0">GitHub 配置</h3>
    <div class="form-group">
      <label>Personal Access Token (PAT)</label>
      <input type="password" id="cfg-token" placeholder="ghp_xxxxxxxxxxxx" />
    </div>
    <div class="frontmatter-grid">
      <div class="form-group">
        <label>仓库所有者</label>
        <input type="text" id="cfg-owner" value="TANGJIN13" />
      </div>
      <div class="form-group">
        <label>仓库名</label>
        <input type="text" id="cfg-repo" value="tangjin-blog" />
      </div>
    </div>
    <div class="form-group">
      <label>分支</label>
      <input type="text" id="cfg-branch" value="main" />
    </div>
    <button class="btn btn-primary" id="btn-save-settings">保存配置</button>
  </div>

  <!-- 文章列表 -->
  <div class="posts-list" id="posts-list" style="display:none">
    <h3>已有文章</h3>
    <div id="posts-container"></div>
  </div>

  <!-- 友链管理 -->
  <div class="manage-panel" id="friends-panel" style="display:none">
    <div class="manage-head">
      <h3 style="margin:0">友链管理</h3>
      <button class="btn btn-primary" id="btn-add-friend">+ 添加友链</button>
    </div>
    <p class="manage-tip">改动保存后会自动提交到 GitHub，约 1-2 分钟后线上生效。</p>
    <div id="friends-container"></div>

    <!-- 友链表单（添加/编辑共用） -->
    <div class="manage-form" id="friend-form" style="display:none">
      <h4 id="friend-form-title">添加友链</h4>
      <input type="hidden" id="friend-edit-index" value="-1" />
      <div class="form-group">
        <label>名字</label>
        <input type="text" id="friend-name" placeholder="例如：张三" />
      </div>
      <div class="form-group">
        <label>网址</label>
        <input type="text" id="friend-url" placeholder="https://xxx.com/" />
      </div>
      <div class="form-group">
        <label>头像图片地址</label>
        <input type="text" id="friend-avatar" placeholder="https://xxx.com/avatar.png" />
      </div>
      <div class="form-group">
        <label>一句话介绍</label>
        <input type="text" id="friend-desc" placeholder="例如：安全大佬" />
      </div>
      <div style="display:flex;gap:0.5rem">
        <button class="btn btn-primary" id="btn-save-friend">保存</button>
        <button class="btn" id="btn-cancel-friend">取消</button>
      </div>
    </div>
  </div>

  <!-- 分类管理 -->
  <div class="manage-panel" id="categories-panel" style="display:none">
    <div class="manage-head">
      <h3 style="margin:0">分类管理</h3>
      <button class="btn btn-primary" id="btn-add-category">+ 添加分类</button>
    </div>
    <p class="manage-tip">分类「slug」用于网址，用英文/数字/连字符，不要有空格。</p>
    <div id="categories-container"></div>

    <!-- 分类表单 -->
    <div class="manage-form" id="category-form" style="display:none">
      <h4 id="category-form-title">添加分类</h4>
      <input type="hidden" id="category-edit-index" value="-1" />
      <div class="form-group">
        <label>分类名</label>
        <input type="text" id="category-name" placeholder="例如：逆向" />
      </div>
      <div class="form-group">
        <label>slug（网址用，英文）</label>
        <input type="text" id="category-slug" placeholder="例如：reverse" />
      </div>
      <div class="form-group">
        <label>描述</label>
        <input type="text" id="category-desc" placeholder="一句话描述" />
      </div>
      <div class="form-group">
        <label>图标（Icon 名，可选）</label>
        <input type="text" id="category-icon" placeholder="例如：lock / flag / terminal / text" />
      </div>
      <div style="display:flex;gap:0.5rem">
        <button class="btn btn-primary" id="btn-save-category">保存</button>
        <button class="btn" id="btn-cancel-category">取消</button>
      </div>
    </div>
  </div>


  <!-- 编辑器 -->
  <div class="editor-panel" id="editor-panel">
    <div class="editor-toolbar">
      <button class="toolbar-btn" data-action="bold">**粗体**</button>
      <button class="toolbar-btn" data-action="italic">*斜体*</button>
      <button class="toolbar-btn" data-action="code">`代码`</button>
      <button class="toolbar-btn" data-action="link">[链接](url)</button>
      <button class="toolbar-btn" data-action="h2">## 标题</button>
      <button class="toolbar-btn" data-action="h3">### 小标题</button>
      <button class="toolbar-btn" data-action="quote">> 引用</button>
      <button class="toolbar-btn" data-action="list">- 列表</button>
      <button class="toolbar-btn" data-action="image">![图片](url)</button>
      <button class="toolbar-btn" data-action="table">表格</button>
      <div style="flex:1"></div>
      <button class="btn btn-primary" id="btn-publish" style="padding:0.35rem 0.8rem;font-size:0.85rem"><svg class="nav-ico" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>发布</button>
    </div>

    <!-- Frontmatter -->
    <div style="padding: 0.75rem 1rem; border-bottom: 1px solid #e5e7eb; background: #fafbfc;">
      <div class="frontmatter-grid">
        <div class="form-group" style="margin-bottom:0">
          <input type="text" id="fm-title" placeholder="文章标题" style="font-weight:600" />
        </div>
        <div class="form-group" style="margin-bottom:0">
          <select id="fm-category">
            <option value="">-- 分类（可选）--</option>
          </select>
        </div>
        <div class="form-group" style="margin-bottom:0">
          <input type="text" id="fm-tags" placeholder="标签（逗号分隔）" />
        </div>
      </div>
      <div class="form-group" style="margin-bottom:0; margin-top:0.5rem;">
        <input type="text" id="fm-desc" placeholder="文章描述" />
      </div>
    </div>

    <div class="editor-split">
      <div class="editor-pane">
        <textarea id="editor" placeholder="在这里写 Markdown..."></textarea>
      </div>
      <div class="preview-pane" id="preview"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // 配置
  const cfg = {
    token: localStorage.getItem('gh_token') || '',
    owner: localStorage.getItem('gh_owner') || 'TANGJIN13',
    repo: localStorage.getItem('gh_repo') || 'tangjin-blog',
    branch: localStorage.getItem('gh_branch') || 'main',
  };

  // DOM
  const $ = id => document.getElementById(id);
  const editor = $('editor');
  const preview = $('preview');
  const toast = $('toast');

  // 提示条关闭（记住选择）
  const hintBar = document.getElementById('hint-bar');
  const hintClose = document.getElementById('hint-close');
  if (localStorage.getItem('admin_hint_closed') === '1') hintBar.classList.add('hidden');
  hintClose.addEventListener('click', () => {
    hintBar.classList.add('hidden');
    localStorage.setItem('admin_hint_closed', '1');
  });

  // Toast
  function showToast(msg, type = 'info') {
    toast.textContent = msg;
    toast.className = `toast show ${type}`;
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  // 设置面板
  
  // Token 状态检查
  function checkTokenStatus() {
    const el = document.getElementById('token-status');
    const msg = document.getElementById('token-status-msg');
    if (!el) return;
    if (localStorage.getItem('gh_token')) { el.style.display = 'none'; }
    else { el.style.display = 'flex'; }
  }
  checkTokenStatus();
  $('token-status-go')?.addEventListener('click', () => { $('btn-settings')?.click(); });

$('btn-settings').addEventListener('click', () => {
    $('settings-panel').classList.toggle('open');
    $('cfg-token').value = cfg.token;
    $('cfg-owner').value = cfg.owner;
    $('cfg-repo').value = cfg.repo;
    $('cfg-branch').value = cfg.branch;
  });

  $('btn-save-settings').addEventListener('click', () => {
    cfg.token = $('cfg-token').value.trim();
    cfg.owner = $('cfg-owner').value.trim();
    cfg.repo = $('cfg-repo').value.trim();
    cfg.branch = $('cfg-branch').value.trim();
    localStorage.setItem('gh_token', cfg.token);
    localStorage.setItem('gh_owner', cfg.owner);
    localStorage.setItem('gh_repo', cfg.repo);
    localStorage.setItem('gh_branch', cfg.branch);
    $('settings-panel').classList.remove('open');
          checkTokenStatus();
    showToast('配置已保存', 'success');
  });

  // 文章列表
  $('btn-posts').addEventListener('click', async () => {
    const list = $('posts-list');
    const panel = $('editor-panel');
    if (list.style.display === 'none') {
      hideAllPanels();
      list.style.display = 'block';
      panel.style.display = 'none';
      await loadPosts();
    } else {
      hideAllPanels();
      panel.style.display = 'block';
    }
  });

  async function loadPosts() {
    if (!cfg.token) { showToast('请先配置 GitHub Token', 'error'); return; }
    try {
      const res = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/src/content/posts?ref=${cfg.branch}`, {
        headers: { Authorization: `token ${cfg.token}`, Accept: 'application/vnd.github.v3+json' }
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const files = await res.json();
      const container = $('posts-container');
      container.innerHTML = '';
      if (!Array.isArray(files)) { container.innerHTML = '<p style="color:#9ca3af">暂无文章</p>'; return; }
      for (const f of files) {
        if (!f.name.endsWith('.md')) continue;
        const div = document.createElement('div');
        div.className = 'post-item';
        div.innerHTML = `
          <div class="post-item-info">
            <span class="post-item-title">${f.name}</span>
            <span class="post-item-meta">${f.path}</span>
          </div>
          <div class="post-item-actions">
            <button class="btn" style="padding:0.3rem 0.6rem;font-size:0.8rem" data-action="edit" data-path="${f.path}" data-sha="${f.sha}">编辑</button>
            <button class="btn btn-danger" style="padding:0.3rem 0.6rem;font-size:0.8rem" data-action="delete" data-path="${f.path}" data-sha="${f.sha}">删除</button>
          </div>
        `;
        container.appendChild(div);
      }
      // 绑定编辑/删除
      container.querySelectorAll('[data-action="edit"]').forEach(btn => {
        btn.addEventListener('click', () => editPost(btn.dataset.path, btn.dataset.sha));
      });
      container.querySelectorAll('[data-action="delete"]').forEach(btn => {
        btn.addEventListener('click', () => deletePost(btn.dataset.path, btn.dataset.sha));
      });
    } catch (e) {
      showToast('加载失败: ' + e.message, 'error');
    }
  }

  async function editPost(path, sha) {
    if (!cfg.token) { showToast('请先配置 GitHub Token', 'error'); return; }
    try {
      const res = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}?ref=${cfg.branch}`, {
        headers: { Authorization: `token ${cfg.token}`, Accept: 'application/vnd.github.v3+json' }
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      // 正确解码 UTF-8：atob 得到字节串，再还原成 UTF-8 文本（与写入端对称）
      const content = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
      // 解析 frontmatter
      const fmMatch = content.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
      if (fmMatch) {
        const fm = fmMatch[1];
        const body = fmMatch[2];
        const titleMatch = fm.match(/title:\s*["']?(.+?)["']?\s*$/m);
        const descMatch = fm.match(/description:\s*["']?(.+?)["']?\s*$/m);
        const tagsMatch = fm.match(/tags:\s*\[(.+?)\]/);
        $('fm-title').value = titleMatch ? titleMatch[1] : '';
        $('fm-desc').value = descMatch ? descMatch[1] : '';
        $('fm-tags').value = tagsMatch ? tagsMatch[1] : '';
        $('fm-category').value = '';
        loadCategoryOptions();
        // 如果文章已有分类，选中它
        const catMatch = fm.match(/category:\s*(\S+)/);
        if (catMatch) $('fm-category').value = catMatch[1];
        editor.value = body;
      } else {
        editor.value = content;
      }
      $('posts-list').style.display = 'none';
      $('editor-panel').style.display = 'block';
      updatePreview();
      showToast('已加载文章，编辑后点击发布', 'info');
    } catch (e) {
      showToast('加载失败: ' + e.message, 'error');
    }
  }

  async function deletePost(path, sha) {
    if (!confirm('确定删除这篇文章？')) return;
    if (!cfg.token) { showToast('请先配置 GitHub Token', 'error'); return; }
    try {
      const res = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}`, {
        method: 'DELETE',
        headers: { Authorization: `token ${cfg.token}`, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: `Delete ${path}`, sha, branch: cfg.branch })
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      showToast('已删除', 'success');
      loadPosts();
    } catch (e) {
      showToast('删除失败: ' + e.message, 'error');
    }
  }

  // 编辑器工具栏
  document.querySelectorAll('.toolbar-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const action = btn.dataset.action;
      const ta = editor;
      const start = ta.selectionStart;
      const end = ta.selectionEnd;
      const sel = ta.value.substring(start, end);
      const insertions = {
        bold: ['**', sel || '粗体', '**'],
        italic: ['*', sel || '斜体', '*'],
        code: ['`', sel || '代码', '`'],
        link: ['[', sel || '文字', '](url)'],
        h2: ['## ', sel || '标题', ''],
        h3: ['### ', sel || '小标题', ''],
        quote: ['> ', sel || '引用', ''],
        list: ['- ', sel || '列表项', ''],
        image: ['![', sel || '描述', '](url)'],
        table: ['| 列1 | 列2 | 列3 |\n|-----|-----|-----|\n| 内容 | 内容 | 内容 |', '', ''],
      };
      const [before, mid, after] = insertions[action] || ['', sel, ''];
      ta.value = ta.value.substring(0, start) + before + mid + after + ta.value.substring(end);
      ta.focus();
      ta.selectionStart = ta.selectionEnd = start + before.length + mid.length;
      updatePreview();
    });
  });

  // 实时预览
  function updatePreview() {
    const md = editor.value;
    // 简易 Markdown 渲染
    let html = md
      .replace(/^### (.+)$/gm, '<h3>$1</h3>')
      .replace(/^## (.+)$/gm, '<h2>$1</h2>')
      .replace(/^# (.+)$/gm, '<h1>$1</h1>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      .replace(/`(.+?)`/g, '<code>$1</code>')
      .replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2">$1</a>')
      .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
      .replace(/^- (.+)$/gm, '<li>$1</li>')
      .replace(/\n\n/g, '</p><p>')
      .replace(/\n/g, '<br>');
    html = '<p>' + html + '</p>';
    preview.innerHTML = html;
  }

  editor.addEventListener('input', updatePreview);

  // 新建文章
  $('btn-new').addEventListener('click', () => {
    $('fm-title').value = '';
    $('fm-desc').value = '';
    $('fm-tags').value = '';
    $('fm-category').value = '';
    loadCategoryOptions();
    editor.value = '';
    updatePreview();
    hideAllPanels();
    $('editor-panel').style.display = 'block';
  });
  
  // 加载分类选项到发布表单下拉框
  async function loadCategoryOptions() {
    const sel = $('fm-category');
    if (!sel) return;
    sel.innerHTML = '<option value="">-- 分类（可选）--</option>';
    try {
      const { content: src } = await fetchFileContent('src/data/categories.ts');
      const cats = parseCategories(src);
      for (const c of cats) {
        const opt = document.createElement('option');
        opt.value = c.slug;
        opt.textContent = c.name;
        sel.appendChild(opt);
      }
    } catch { /* 忽略，保持默认空选项 */ }
  }

  // 发布
  $('btn-publish').addEventListener('click', async () => {
    if (!cfg.token) { showToast('请先配置 GitHub Token', 'error'); return; }
    const title = $('fm-title').value.trim();
    const desc = $('fm-desc').value.trim();
    const tags = $('fm-tags').value.trim();
      const category = $('fm-category').value;
    const body = editor.value.trim();

    if (!title || !body) { showToast('标题和正文不能为空', 'error'); return; }

    const slug = title.toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5]+/g, '-').replace(/^-|-$/g, '') || 'post';
    const date = new Date().toISOString().slice(0, 10);
    const filename = `src/content/posts/${date}-${slug}.md`;

    const tagList = tags ? tags.split(/[,，]/).map(t => {
      const clean = t.trim().replace(/^["']+|["']+$/g, '');
      return `"${clean}"`;
    }).join(', ') : '"随笔"';
    const content = `---
title: "${title}"
description: "${desc}"
published: ${date}
category: ${category || ''}
tags: [${tagList}]
---

${body}
`;

    try {
      const res = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${filename}`, {
        method: 'PUT',
        headers: { Authorization: `token ${cfg.token}`, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: `Add post: ${title}`,
          content: btoa(unescape(encodeURIComponent(content))),
          branch: cfg.branch
        })
      });
      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.message || `HTTP ${res.status}`);
      }
      showToast('已提交！约 1-2 分钟后自动上线', 'success');
      setTimeout(() => {
        if (confirm('文章已推送到 GitHub。\n\n是否现在打开部署状态页面查看构建进度？')) {
          window.open('https://github.com/TANGJIN13/tangjin-blog/actions', '_blank');
        }
      }, 800);
    } catch (e) {
      showToast('发布失败: ' + e.message, 'error');
    }
  });

  // ============ 友链管理 ============
  const FRIENDS_FILE = 'src/pages/friends.astro';

  function esc(s) { return (s || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }

  // 默认分类图标（SVG inline）
  const icoSvg = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>';
  // 默认分类图标（SVG inline）
  async function fetchFileContent(path) {
    const token = localStorage.getItem('gh_token') || '';
    const owner = localStorage.getItem('gh_owner') || 'TANGJIN13';
    const repo = localStorage.getItem('gh_repo') || 'tangjin-blog';
    const branch = localStorage.getItem('gh_branch') || 'main';
    const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${branch}`, {
      headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' }
    });
    if (!res.ok) throw new Error(`读取失败 HTTP ${res.status}`);
    const data = await res.json();
    const content = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
    return { content, sha: data.sha };
  }

  async function saveFileContent(path, content, message, sha) {
    const token = localStorage.getItem('gh_token') || '';
    const owner = localStorage.getItem('gh_owner') || 'TANGJIN13';
    const repo = localStorage.getItem('gh_repo') || 'tangjin-blog';
    const branch = localStorage.getItem('gh_branch') || 'main';
    const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
      method: 'PUT',
      headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message,
        content: btoa(unescape(encodeURIComponent(content))),
        branch: cfg.branch,
        ...(sha ? { sha } : {})
      })
    });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.message || `HTTP ${res.status}`);
    }
  }

  // ---- 友链：解析 / 生成 ----
  function parseFriends(content) {
    const m = content.match(/const friends: Friend\[\] = \[([\s\S]*?)\];/);
    if (!m) return [];
    const arr = m[1];
    const items = [];
    const re = /\{\s*name:\s*'((?:[^'\\]|\\.)*)',\s*url:\s*'((?:[^'\\]|\\.)*)',\s*avatar:\s*'((?:[^'\\]|\\.)*)',\s*description:\s*'((?:[^'\\]|\\.)*)'\s*\}/g;
    let g;
    while ((g = re.exec(arr)) !== null) {
      items.push({ name: g[1], url: g[2], avatar: g[3], description: g[4] });
    }
    return items;
  }

  function generateFriends(friends) {
    const arr = friends.map(f => `  { name: '${esc(f.name)}', url: '${esc(f.url)}', avatar: '${esc(f.avatar)}', description: '${esc(f.description)}' },`).join('\n');
    return `const friends: Friend[] = [\n${arr}\n];`;
  }

  let friendsCache = [];
  let friendsSha = null;

  async function loadFriends() {
    if (!cfg.token) { showToast('请先配置 GitHub Token', 'error'); return; }
    try {
      const { content, sha } = await fetchFileContent(FRIENDS_FILE);
      friendsSha = sha;
      friendsCache = parseFriends(content);
      renderFriends();
    } catch (e) { showToast('加载友链失败: ' + e.message, 'error'); }
  }

  function renderFriends() {
    const c = $('friends-container');
    c.innerHTML = '';
    if (!friendsCache.length) { c.innerHTML = '<p style="color:#9ca3af">暂无友链</p>'; return; }
    friendsCache.forEach((f, i) => {
      const div = document.createElement('div');
      div.className = 'manage-item';
      div.innerHTML = `
        <img class="manage-item-avatar" src="${esc(f.avatar)}" alt="" onerror="this.style.visibility='hidden'" />
        <div class="manage-item-info">
          <div class="manage-item-name">${esc(f.name)}</div>
          <div class="manage-item-desc">${esc(f.url)} · ${esc(f.description)}</div>
        </div>
        <div class="manage-item-actions">
          <button class="btn-sm" data-edit="${i}">编辑</button>
          <button class="btn-sm danger" data-del="${i}">删除</button>
        </div>`;
      c.appendChild(div);
    });
    c.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openFriendForm(Number(b.dataset.edit))));
    c.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => deleteFriend(Number(b.dataset.del))));
  }

  function openFriendForm(index) {
    const f = index >= 0 ? friendsCache[index] : { name: '', url: '', avatar: '', description: '' };
    $('friend-edit-index').value = String(index);
    $('friend-form-title').textContent = index >= 0 ? '编辑友链' : '添加友链';
    $('friend-name').value = f.name;
    $('friend-url').value = f.url;
    $('friend-avatar').value = f.avatar;
    $('friend-desc').value = f.description;
    $('friend-form').style.display = 'block';
  }

  async function persistFriends() {
    const content = (await fetchFileContent(FRIENDS_FILE)).content;
    const newContent = content.replace(/const friends: Friend\[\] = \[[\s\S]*?\];/, generateFriends(friendsCache));
    await saveFileContent(FRIENDS_FILE, newContent, 'Update friends', friendsSha);
  }

  $('btn-friends').addEventListener('click', async () => {
    hideAllPanels();
    $('friends-panel').style.display = 'block';
    await loadFriends();
  });
  $('btn-add-friend').addEventListener('click', () => openFriendForm(-1));
  $('btn-cancel-friend').addEventListener('click', () => { $('friend-form').style.display = 'none'; });
  $('btn-save-friend').addEventListener('click', async () => {
    const name = $('friend-name').value.trim();
    const url = $('friend-url').value.trim();
    const avatar = $('friend-avatar').value.trim();
    const description = $('friend-desc').value.trim();
    if (!name || !url) { showToast('名字和网址不能为空', 'error'); return; }
    const idx = Number($('friend-edit-index').value);
    const item = { name, url, avatar, description };
    try {
      if (idx >= 0) friendsCache[idx] = item; else friendsCache.push(item);
      await persistFriends();
      renderFriends();
      $('friend-form').style.display = 'none';
      showToast('友链已保存，约 1-2 分钟后上线', 'success');
    } catch (e) { showToast('保存失败: ' + e.message, 'error'); }
  });
  async function deleteFriend(index) {
    if (!confirm(`确定删除友链「${friendsCache[index].name}」？`)) return;
    try {
      friendsCache.splice(index, 1);
      await persistFriends();
      renderFriends();
      showToast('已删除', 'success');
    } catch (e) { showToast('删除失败: ' + e.message, 'error'); }
  }

  // ============ 分类管理 ============
  const CATEGORIES_FILE = 'src/data/categories.ts';

  function parseCategories(content) {
    const m = content.match(/export const categories: Category\[\] = \[([\s\S]*?)\];/);
    if (!m) return [];
    const arr = m[1];
    const items = [];
    const re = /\{\s*name:\s*'((?:[^'\\]|\\.)*)',\s*slug:\s*'((?:[^'\\]|\\.)*)',\s*description:\s*'((?:[^'\\]|\\.)*)',\s*icon:\s*'((?:[^'\\]|\\.)*)'\s*\}/g;
    let g;
    while ((g = re.exec(arr)) !== null) {
      items.push({ name: g[1], slug: g[2], description: g[3], icon: g[4] });
    }
    return items;
  }

  function generateCategories(cats) {
    const arr = cats.map(c => `  { name: '${esc(c.name)}', slug: '${esc(c.slug)}', description: '${esc(c.description)}', icon: '${esc(c.icon)}' },`).join('\n');
    return `export const categories: Category[] = [\n${arr}\n];`;
  }

  let categoriesCache = [];
  let categoriesSha = null;

  async function loadCategories() {
    if (!cfg.token) { showToast('请先配置 GitHub Token', 'error'); return; }
    try {
      const { content, sha } = await fetchFileContent(CATEGORIES_FILE);
      categoriesSha = sha;
      categoriesCache = parseCategories(content);
      renderCategories();
    } catch (e) { showToast('加载分类失败: ' + e.message, 'error'); }
  }

  function renderCategories() {
    const c = $('categories-container');
    c.innerHTML = '';
    if (!categoriesCache.length) { c.innerHTML = '<p style="color:#9ca3af">暂无分类</p>'; return; }
    categoriesCache.forEach((cat, i) => {
      const div = document.createElement('div');
      div.className = 'manage-item';
      div.innerHTML = `
        <div class="manage-item-icon">${cat.icon ? esc(cat.icon) : icoSvg}</div>
        <div class="manage-item-info">
          <div class="manage-item-name">${esc(cat.name)} <span style="color:#9ca3af;font-weight:400">/ ${esc(cat.slug)}</span></div>
          <div class="manage-item-desc">${esc(cat.description)}</div>
        </div>
        <div class="manage-item-actions">
          <button class="btn-sm" data-edit="${i}">编辑</button>
          <button class="btn-sm danger" data-del="${i}">删除</button>
        </div>`;
      c.appendChild(div);
    });
    c.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openCategoryForm(Number(b.dataset.edit))));
    c.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => deleteCategory(Number(b.dataset.del))));
  }

  function openCategoryForm(index) {
    const cat = index >= 0 ? categoriesCache[index] : { name: '', slug: '', description: '', icon: '' };
    $('category-edit-index').value = String(index);
    $('category-form-title').textContent = index >= 0 ? '编辑分类' : '添加分类';
    $('category-name').value = cat.name;
    $('category-slug').value = cat.slug;
    $('category-desc').value = cat.description;
    $('category-icon').value = cat.icon;
    $('category-form').style.display = 'block';
  }

  async function persistCategories() {
    const content = (await fetchFileContent(CATEGORIES_FILE)).content;
    const newContent = content.replace(/export const categories: Category\[\] = \[[\s\S]*?\];/, generateCategories(categoriesCache));
    await saveFileContent(CATEGORIES_FILE, newContent, 'Update categories', categoriesSha);
  }

  $('btn-categories').addEventListener('click', async () => {
    hideAllPanels();
    $('categories-panel').style.display = 'block';
    await loadCategories();
  });
  $('btn-add-category').addEventListener('click', () => openCategoryForm(-1));
  $('btn-cancel-category').addEventListener('click', () => { $('category-form').style.display = 'none'; });
  $('btn-save-category').addEventListener('click', async () => {
    const name = $('category-name').value.trim();
    const slug = $('category-slug').value.trim();
    const description = $('category-desc').value.trim();
    const icon = $('category-icon').value.trim();
    if (!name || !slug) { showToast('分类名和 slug 不能为空', 'error'); return; }
    if (!/^[a-z0-9-]+$/.test(slug)) { showToast('slug 只能用小写英文/数字/连字符', 'error'); return; }
    const idx = Number($('category-edit-index').value);
    const item = { name, slug, description, icon };
    try {
      if (idx >= 0) categoriesCache[idx] = item; else categoriesCache.push(item);
      await persistCategories();
      renderCategories();
      $('category-form').style.display = 'none';
      showToast('分类已保存，约 1-2 分钟后上线', 'success');
    } catch (e) { showToast('保存失败: ' + e.message, 'error'); }
  });
  async function deleteCategory(index) {
    if (!confirm(`确定删除分类「${categoriesCache[index].name}」？`)) return;
    try {
      categoriesCache.splice(index, 1);
      await persistCategories();
      renderCategories();
      showToast('已删除', 'success');
    } catch (e) { showToast('删除失败: ' + e.message, 'error'); }
  }

  function hideAllPanels() {
    $('posts-list').style.display = 'none';
    $('editor-panel').style.display = 'none';
    $('friends-panel').style.display = 'none';
    $('categories-panel').style.display = 'none';
    $('settings-panel').classList.remove('open');
  }
</script>
</body>
</html>
