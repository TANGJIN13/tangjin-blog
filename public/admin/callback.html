<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>登录回调 · tangjin.xyz</title>
</head>
<body>
  <p>登录中...</p>
  <script>
    // GitHub OAuth 回调处理
    const params = new URLSearchParams(location.search);
    const code = params.get('code');
    const state = params.get('state');

    if (!code) {
      document.body.innerHTML = '<p>登录失败：没有收到授权码</p>';
      throw new Error('No code');
    }

    // 用 code 换 token（通过公开的中继服务，避免暴露 client_secret）
    // 这里用 GitHub 自己的 token 端点（不需要 secret，因为是 client-side 隐式流）
    // 但 code 换 token 需要 secret，所以改用隐式授权（implicit grant）
    // 实际上 implicit grant 直接在 callback URL 的 hash 里返回 access_token

    // 检查 hash 里是否有 token（implicit flow）
    const hashParams = new URLSearchParams(location.hash.slice(1));
    const accessToken = hashParams.get('access_token');

    if (accessToken) {
      // 验证用户身份
      fetch('https://api.github.com/user', {
        headers: { Authorization: 'token ' + accessToken }
      })
        .then(r => r.json())
        .then(user => {
          if (user.login === 'TANGJIN13') {
            localStorage.setItem('gh_token', accessToken);
            localStorage.setItem('gh_user', JSON.stringify(user));
            location.href = '/admin/';
          } else {
            document.body.innerHTML = `<p>❌ 拒绝访问：${user.login} 不是管理员（需要 TANGJIN13）</p>`;
          }
        })
        .catch(e => {
          document.body.innerHTML = '<p>登录失败：' + e.message + '</p>';
        });
    } else {
      document.body.innerHTML = '<p>登录失败：没有收到 token</p>';
    }
  </script>
</body>
</html>
