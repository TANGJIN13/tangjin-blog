server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name tangjin.xyz www.tangjin.xyz _;

    root /var/www/blog;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/xml application/xml+rss text/javascript image/svg+xml;

    # 静态资源缓存
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|webp|ico|woff2?|mp3)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Astro 输出结构适配
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Waline 评论系统
    location /waline/ {
        proxy_pass http://127.0.0.1:8365/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Umami 统计
    location /umami/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Umami 统计脚本
    location /umami.js {
        proxy_pass http://127.0.0.1:3001/umami.js;
        proxy_set_header Host $host;
        expires 7d;
    }

    error_page 404 /404.html;
    location /.well-known/ {
        try_files $uri =404;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tangjin.xyz www.tangjin.xyz;

    ssl_certificate /etc/letsencrypt/live/tangjin.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tangjin.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/blog;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/xml application/xml+rss text/javascript image/svg+xml;

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|webp|ico|woff2?|mp3)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Waline 评论系统
    location /waline/ {
        proxy_pass http://127.0.0.1:8365/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Umami 统计
    location /umami/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Umami 统计脚本
    location = /umami.js {
        proxy_pass http://127.0.0.1:3001/umami.js;
        proxy_set_header Host $host;
        expires 7d;
    }

    error_page 404 /404.html;
    location /.well-known/ {
        try_files $uri =404;
    }
}
